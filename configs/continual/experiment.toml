# ONE EXPERIMENT PER WORKTREE.
#
# Experiment identity is the worktree, not a config key: anything that is a code
# or content edit -- the starting skill package (`harnesses/nethack-prime-agent/
# nethack_prime_agent/skill/SKILL.md`), the env, the launcher, the orchestrator's
# reflection prompt -- is just an edit in that worktree, which is far easier to
# keep current than a config file enumerating every variation.
#
# This file therefore holds ONLY the things that are genuinely numbers, plus the
# identity used to name the store and the outputs. Its sha256 is pinned into
# every cell's config.toml, so a run can be replayed from its artifacts.
#
#   git worktree add /root/nld/e13-five-seed -b exp/e13-five-seed <base>
#   # edit this file + the reflection prompt + (optionally) the skill package
#   tools/cli_harness_eval/run_e13.sh

id = "multi-verify"
replicate = 1

# How many reflect -> play rounds. Each round is len(corpus_seeds) games.
rounds = 2

# The games the agent plays and reflects on. The other arm of the headline
# comparison sets this to a single seed and asks the same lessons to generalise.
corpus_seeds = [5, 6, 7, 8, 9]

# HELD OUT. Never played during the experiment and never reflected on; the
# frozen store is evaluated on these by tools/cli_harness_eval/eval_frozen.sh,
# which we run ourselves after the experiment ends -- not by the experiment.
eval_seeds = [0, 1, 2, 3, 4]

# true  -> players write their own lessons mid-play; each rollout gets a private
#          copy of the store and the runner merges them after every cell
#          (`continual_harness_mode = copy-merge`).
# false -> only an orchestrator writes, between cells, and the store is mounted
#          read-only for players (`shared-ro`).
players_may_edit = true

# Same-id disagreements between two rollouts. "newest-wins" keeps the later
# `updated_at` and records the loser in the merge report either way.
merge = "newest-wins"

# The orchestrator's reflection instructions, relative to configs/continual/.
# Appended AFTER the invariant contract, so a variant can add guidance but not
# drop the output format, the entry budget, or the read-only rule.
prompt = "default.md"

# Tier the games run at. `continual` carries [base]'s flags plus the store, so a
# measured gain is the agent's own edits rather than the hand-engineered fixes.
tier = "continual"
