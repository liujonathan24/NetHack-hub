[project]
name = "nethack-plus"
version = "0.1.0"
description = "Run NetHack LLM experiments on Prime: single games or checkpointed exploration (Prime-Agent-Explore)"
requires-python = ">=3.12,<3.14"
dependencies = [
    # The verifiers taskset: the nethack env, its tool server and DEFAULT_IMAGE. The commit
    # and the game image move together (the image refuses a different game.py).
    "nethack @ git+https://github.com/RL-Residency/residency-environments.git@adffc89#subdirectory=environments/nethack",
]

[project.scripts]
nethack-plus = "nethack_plus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nethack_plus"]

[tool.hatch.metadata]
allow-direct-references = true
[tool.ruff]
line-length = 120
