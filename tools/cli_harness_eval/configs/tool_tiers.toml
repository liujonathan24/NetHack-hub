skill_doc_coords = false
[e14div_kimik3.contract]
model = "moonshotai/kimi-k3"
max_relaunches = 0

# ANTHROPIC MODELS ARE NOT IN THIS SWEEP. Measured, not assumed: the seed-1
# pilot recorded `cached_input_tokens` of EXACTLY ZERO for claude-fable-5
# (11.82M fresh input over 222 calls) and claude-sonnet-5 (15.28M over 252),
# where every other model on Prime cached 87-99% of its input. A NetHack
# rollout re-sends the whole conversation every call, so with no cache one
# fable-5 rollout billed $120.04 -- confirmed to the cent against a wallet row,
# and 4x the remaining balance for a single 15-rollout cell. Sonnet 5 is $462 a
# cell on the same mechanism. Both reached D4.
#
# This is a billing property, not a capability judgement, and it is reversible:
# Prime exposes `prompt_tokens_details.cache_write_tokens`, so explicit
# cache-control breakpoints on the Anthropic path would cut these by roughly an
# order of magnitude. Scope that deliberately before adding these tiers back.
#
# [e14div_sol] stays: gpt-5.6-sol caches at 95.8% and cost $0.32 for its pilot
# rollout.
[e14div_sol]
netplay_telemetry = false
melee_hints = false
skill_doc_coords = false
[e14div_sol.contract]
model = "openai/gpt-5.6-sol"
max_relaunches = 0
