# flags off, frozen harness -- plus exactly ONE differing factor, so the E14
# uncapped base cells (outputs/e14_uncapped/base_r{1,2,3}) are the control arm
# for every one of them. A [<tier>.contract] sub-table overrides the global
# contract for that tier only (variant / skill_set / tune knobs); everything
# not named is inherited, including tune.reveal_map = 1.0.

[p1_gate]      # P1: descent gate, suggest-first (NLD human-norm line at each descend)
