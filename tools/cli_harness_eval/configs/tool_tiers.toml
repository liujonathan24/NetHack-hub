# Tool-tier registry for reproducible cells (docs/CONTINUAL_HARNESS_BASELINE.md).
#
# A cell declares ONE tier; the launcher expands it to the flags below and the
# resolved values land in the cell's output config.toml. all-off == the tree as
# the E10 baseline measured it; all-on == current HEAD behaviour.
#
# [base] -- frozen. The E10 reference surface (np_core + request_map + search
#   on the honest harness). Reference numbers: median 3.54 / mean 5.34 /
#   14 of 15 died / ceiling dl11 (outputs/e10_baseline/).
# [human] -- the manually engineered post-baseline fixes (PR #29/#31):
#   E12 measured repeat-cluster budget 67% -> 35%, outcomes unchanged.
#   Additions to this tier require a commit + a measured cell.
# [continual] -- reserved for tools/edits the continual harness generates.
#   MUTATES over time: every continual run must pin this file's git commit and
#   the generated-code commit in its output config.toml, and is its own arm --
#   never pooled with base or human.

# ---------------------------------------------------------------------------
# THE CELL CONTRACT. Emitted for EVERY tier, because a tier selects which
# post-baseline fixes are on -- not what game is played. Without this,
# `TOOL_TIER=base` was a pure no-op: it expanded to nothing, so a cell inherited
# configs/prime_agent.toml (skill_set=netplay_true, variant=B0, 150 calls, 16
# seeds) and was wrong on four factors while calling itself the E10 baseline.
#
# These are the values outputs/e10_baseline/ actually ran. Changing any of them
# is a new baseline experiment with re-measured reference numbers, not an edit.
[contract]
skill_set = "np_core,request_map,search"
auto_dismiss = "false"
variant = "BBOX_MIN"
# 0 = UNCAPPED: every rollout plays until the character dies, ascends, or NLE
# truncates. Previously 200, which turned out to censor the thing we measure:
# in E13-v2 round 2, three of five rollouts were still ALIVE when the budget ran
# out (at dlvl 6, 8 and 9 and still descending), so `max_dlvl_reached` was a
# lower bound, not a score -- and because round 1 had only one such rollout and
# round 2 had three, the bias fell unevenly across the very rounds being
# compared. Deaths halved 4 -> 2 while mean depth looked flat; on the games that
# actually finished it was 8.00 -> 10.00.
#
# Backstops that remain, so this cannot run away: NLE's own
# max_episode_steps=100_000 in-game steps, and [timeout] rollout=7200s per
# rollout in the arm config.
max_calls = 0
seeds = [0, 1, 2, 3, 4]
model = "z-ai/glm-5.2"
character = "Val-hum-neu-fem"
task_spec = "full_nle"
# Harness-side factors the baseline also fixed. allow_batching is load-bearing:
# with it on, the no-batch rule is stripped from the served document AFTER the
# frozen-doc hash check, so a cell labelled [base] served 4753 bytes where E10
# served 4829 -- byte-fidelity defeated with no error.
allow_batching = false
# E15 fix2 (user-approved, 2026-08-26): 2, not 0. The prime_agent.toml
# "ARM SYMMETRY" rationale for 0 protected a prime-vs-claude_code scaffold
# comparison; the E15 probe grid is prime-only, and 0 let empty completions
# (model returns finish=stop with no text and no tool call) end LIVE runs as
# `agent_completed` -- P3 r1 seed 4 died this way at D11 (best in arm),
# v2_bjson lost 3/5 rollouts, v2_json seed 1 was cut at D10. The relaunch
# loop resumes the same MCP tool server with _RESUME_PROMPT; the count is
# recorded per rollout as metrics.prime_agent_relaunches. CAVEAT for
# analysis: the frozen E14 control ran with 0, so depth tails in retry-on
# arms are not strictly harness-identical to control -- check the relaunch
# metric before attributing a tail difference to the treatment.
max_relaunches = 2
max_parallel_skill_calls = 0

[contract.tune]
# Dropped by the E9/E10-era launchers, which is what made "control" cells run
# fog'd. Its absence is invisible in the launch command and visible only in the
# resolved config.toml -- hence the read-back in preflight.
reveal_map = 1.0

[contract.code_pin]
# The tree state the reference numbers describe.
branch = "exp/e8-planning-guidance"
honesty_pass = ["fd8aa13", "9b8d5a4"]
launcher_restore = "0458275"

[contract.reference]
# RE-DERIVED FROM THE RAW ROLLOUTS, 2026-08-29. Two of these numbers were
# wrong; both are corrected here and the derivation is stated so the next
# reader can check rather than inherit.
#
# `runs` pointed at a path that does not exist in this tree. The E10 data
# lives in the hub-eval checkout, not zombie-fix.
runs = "/root/nld/hub-eval/outputs/e10_baseline/NPCORE_v3H_r{1,2,3}__prime_agent"
median_balrog = 3.54
mean_balrog = 5.34
# WAS "14/15", AND THAT DOES NOT REPRODUCE. All 15 rollouts terminate
# `game_over` with `died = 1.0`. The three traces.jsonl files hold EIGHTEEN
# rows, not fifteen: r2 seed 3, r3 seed 0 and r3 seed 2 were each interrupted
# (2x harness_timeout, 1x call_budget_exhausted) and resumed, emitting a second
# row for the same seed. Counting rows rather than rollouts gives 18, and one
# of the interim rows was miscounted as a survivor. Depth and BALROG are
# unaffected -- they are high-water marks.
died = "15/15"
ceiling_dlvl = 11
# These numbers are CALL-CAPPED and are not on the same axis as any uncapped
# arm. E10 ran max_turns = max_skill_calls = 200; E14, every E15 probe and E16
# run uncapped. The uncapped control is outputs/e14_uncapped/base_r{1,2,3},
# which measures mean 9.96 / median 6.96 / ceiling Dlvl 13 over the same 15
# rollouts -- nearly double, because the cap was censoring the measurement.
# Compare an uncapped arm against `uncapped_*` below, never against the E10
# figures above.
uncapped_runs = "outputs/e14_uncapped/base_r{1,2,3}__prime_agent"
uncapped_mean_balrog = 9.96
uncapped_median_balrog = 6.96
uncapped_ceiling_dlvl = 13
uncapped_died = "15/15"
# registry.json reports [mean, STANDARD ERROR], not [mean, SD]. base's
# [9.96, 2.19] is 8.464/sqrt(15). Multiply by sqrt(n) for SD.
error_bars = "standard error, not SD"
balrog_metric = "balrog_both (vendored BALROG achievement table), 0-100 percent"

[base]
# env-side (ENV_ARGS -> tool_flags)
netplay_telemetry = false
melee_hints = false
# harness-side (PrimeAgentHarnessConfig)
skill_doc_coords = false

[human]
netplay_telemetry = true
melee_hints = true
skill_doc_coords = true

