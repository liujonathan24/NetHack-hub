# ---------------------------------------------------------------------------
# E16 GO-EXPLORE (2026-08-28). The GE-wiki arm of the Go-Explore-on-one-seed
# design: an orchestrator resumes players from an archive of persistent
# checkpoints instead of starting each attempt cold.
#
# THE ONLY DELTA FROM [base] IS THE SKILL SET. Doc, model, character,
# task_spec, variant (BBOX_MIN), tune.reveal_map, auto_dismiss, max_calls (0 =
# uncapped, which the design requires: the deepest run in the program took 353
# calls and a cap would truncate exactly the deep pushes this experiment exists
# to produce), allow_batching, max_relaunches, and all three fix flags are
# inherited unchanged. Diff against [base] with:
#     tool_tiers.py flags base | diff - <(tool_tiers.py flags e16_gewiki)
# which must show the skill_set line and the tier-name/hash provenance lines,
# and nothing else.
#
# skill_set = base + rollback + save + wiki.
#   rollback  -- kept, not added for novelty: it is the proven converter
#                behaviour from [p3_rollback], and publishing it is also what
#                arms the per-turn engine snapshot ring (nethack.py:1675 gates
#                the snapshot on the tool being published, so no other arm pays
#                for it).
#   save      -- the model-driven half of the checkpoint archive.
#   wiki      -- the curated two-page knowledge base (why_do_i_keep_dying,
#                standard_strategy), copied into the run directory at launch.
#
# `save` and `wiki` are in helpers._E16_UNPUBLISHED_BY_DEFAULT, which every
# PRESET filters out, so they reach a served prompt only through an explicit
# token in a comma-separated skill_set -- i.e. only through this line. No other
# tier's served bytes move.
#
# SEEDS: the design runs seed 1 only (the program's proven deep seed: D13 in
# the base control, D15 in forced-revive rep 2). That is NOT pinned here,
# because the contract's seed list is a [base] factor and changing it would
# make this tier non-comparable on a second axis; the E16 launcher passes
# SEEDS=[1] N=1, which launch_cell.sh records in the cell's config.toml as
# `seeds_overridden = true`.
[e16_gewiki]
netplay_telemetry = false
melee_hints = false
skill_doc_coords = false
[e16_gewiki.contract]
skill_set = "np_core,request_map,search,rollback,save,wiki"

# ---------------------------------------------------------------------------
# THE ONLY DELTA FROM [e16_gewiki] IS THAT `rollback` IS NOT PUBLISHED.
#
# Why this arm exists. In [e16_gewiki] the player recovers from disaster twice
# over, and BOTH recoveries are gated on the same token:
#
#   1. the model's own `rollback(n)` -- measured in treesmoke6 attempt 1 at
#      LM 436, HP 3/41, which undid the five calls that nearly killed it; and
#   2. FORCED REVIVE, which is not a tool at all. nethack.py:2134 and :2604
#      gate the automatic post-death restore on `"rollback" in
#      _allowed_skill_names`, so publishing the tool silently grants up to
#      `deaths_per_level` (3) free deaths per level with no model choice.
#
# Together those make an attempt very hard to end: treesmoke6 attempt 1 ran 61
# minutes and 539 LM calls without terminating. An attempt that does not end is
# an orchestrator round that never happens, and the selection loop -- the thing
# E16 is actually testing -- goes unexercised. treesmoke6 has one selection
# record with `n_candidates_shown: 1`.
#
# Dropping the token removes both halves at once. That is deliberate and it is
# ONE factor, not two: in-attempt recovery ON vs OFF. With it OFF the first
# death is final, attempts are short, deaths are plentiful, and the ONLY thing
# that can carry progress across them is the archive plus the orchestrator's
# choice of where to resume. Any gain measured here is attributable to
# selection, because nothing else survives a death.
#
# `save` and `wiki` stay: the archive and the knowledge base are not the
# variable. Auto-checkpointing is independent of the rollback ring (it is
# driven by the LM-call counter and level/XL events), so the archive still
# fills. nethack.py:1972 stops arming the per-turn snapshot ring, which is the
# intended saving and not a side effect to correct for.
[e16_gewiki_norb]
netplay_telemetry = false
melee_hints = false
skill_doc_coords = false
[e16_gewiki_norb.contract]
skill_set = "np_core,request_map,search,save,wiki"

# ---------------------------------------------------------------------------
# THE ONLY DELTA FROM [e16_gewiki_norb] IS max_calls: an attempt ends after 50
# LM calls instead of only when the hero dies.
#
# Why it needs its own tier rather than a CLI override: launch_cell refuses a
# MAX_CALLS that contradicts the contract, and it is right to. The contract's
# max_calls is part of what the reference numbers describe -- a capped arm is a
# different experiment from an uncapped one, and saying so in the registry is
# the difference between an arm and an undocumented flag.
#
# What the cap buys. treesmoke8 spent 489 of its 1018 calls on attempt 1 alone
# and gave the orchestrator 8 decisions in the whole run. At 50 the same spend
# buys ~20 decisions. If archive selection is the thing that works, more
# selections per dollar should show up as a steeper progress curve; if it is
# not, this arm will spend the same money for less depth and say so plainly.
#
# NOT comparable to the uncapped reference rows. E10 was call-capped at 200 and
# measured 5.34 mean BALROG where the uncapped E14 control measured 9.96 -- the
# cap censored the measurement. A 50-call cap censors harder. This arm's null
# is treesmoke8 (same tier, uncapped) at matched TOTAL calls, not the published
# baselines.
[e16_gewiki_norb_c50]
netplay_telemetry = false
melee_hints = false
skill_doc_coords = false
[e16_gewiki_norb_c50.contract]
skill_set = "np_core,request_map,search,save,wiki"
max_calls = 50

[continual]
# STARTS FROM BASE, NOT HUMAN. The continual arm's independent variable is the
# store the agent writes for itself, so its floor must be the same floor the
# denominator uses -- otherwise a gain could be the human fixes rather than the
# agent's own edits. All three fix-flags stay false here, exactly as in [base];
# what differs is that a shared continual-harness store is mounted.
#
# The store is per-EXPERIMENT, not global: several continual experiments run
# side by side (different reflection prompts), each with its own run id, store
# and output tree. Path and id are passed by the launcher (CONTINUAL_HARNESS /
# CONTINUAL_RUN_ID) because they vary per run and cannot be named statically
# here; both, plus the reflection-prompt hash, are pinned into every cell's
# config.toml alongside tool_tier.
#
# Every experiment begins with an EMPTY store -- run_e13.sh refuses to start
# round 0 against a non-empty one -- so "starts from the base set of skills" is
# enforced, not merely intended.
netplay_telemetry = false
melee_hints = false
skill_doc_coords = false

# ---------------------------------------------------------------------------
# E14 DIVERSITY (2026-08-31). One tier per model. THE ONLY DELTA FROM [base] IS
# `model` -- plus `max_relaunches`, which is explained below and is not a free
# choice.
#
# The arm these are measured against is outputs/e14_uncapped/base_r{1,2,3}
# (mean BALROG 9.96 +/- 2.19 SE, median 6.96, ceiling Dlvl 13, died 15/15).
# It is the ONLY arm: E10 capped is superseded and is not a comparator. Because
# the arm already ran z-ai/glm-5.2 on these seeds, glm-5.2 has no tier here --
# re-running it would produce a second base arm, which is the thing this
# registry exists to prevent.
#
# max_relaunches = 0, NOT the contract's 2. The contract raised it to 2 in E15
# so that an empty completion (model returns finish=stop with no text and no
# tool call) would not end a LIVE run as `agent_completed`. But the arm was
# measured at 0 -- verified in all three of its config.toml files, and flagged
# in the contract's own E15 note. Launching at 2 would vary a second factor
# against the arm, so every cell here pins 0 and `agent_completed` is reported
# per cell as a first-class outcome instead of being repaired away.
#
# If a candidate turns out to lose a large share of its cell to empty
# completions, the fix is a deliberate follow-up at max_relaunches = 2 WITH a
# matched glm-5.2 control -- not a quiet edit to these lines.
#
# Everything else -- skill_set (np_core,request_map,search: no save, no wiki,
# no rollback), variant BBOX_MIN, map_detail full, tune.reveal_map = 1.0,
# auto_dismiss, character, task_spec, max_calls = 0 (uncapped), allow_batching,
# and all three fix flags -- is inherited from [contract] and [base]. Verify a
# cell before trusting it:
#     tool_tiers.py flags base | diff - <(tool_tiers.py flags e14div_luna)
# which must show ONLY the --model line and the tier provenance lines.

[e14div_luna]
netplay_telemetry = false
melee_hints = false
skill_doc_coords = false
[e14div_luna.contract]
model = "openai/gpt-5.6-luna"
max_relaunches = 0

[e14div_dsv4flash]
netplay_telemetry = false
melee_hints = false
skill_doc_coords = false
[e14div_dsv4flash.contract]
model = "deepseek/deepseek-v4-flash-0731"
max_relaunches = 0

[e14div_gemini37]
netplay_telemetry = false
melee_hints = false
skill_doc_coords = false
[e14div_gemini37.contract]
model = "google/gemini-3.7-flash"
max_relaunches = 0

[e14div_qwen38]
netplay_telemetry = false
melee_hints = false
skill_doc_coords = false
[e14div_qwen38.contract]
model = "qwen/qwen3.8-max"
max_relaunches = 0

[e14div_kimik3]
netplay_telemetry = false
