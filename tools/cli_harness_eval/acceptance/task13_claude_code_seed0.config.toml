model = "z-ai/glm-5.2"
num_tasks = 1
num_rollouts = 1
shuffle = false
max_concurrent = 128
verbose = true
dry_run = false
rich = false
server = false
push = false
output_dir = "<REDACTED>/run"

[taskset]
id = "nethack_v1"
task_spec = "full_nle"
variant = "B1"
map_detail = "full"
interface = "skill"
character = "Val-hum-neu-fem"
max_turns = 200
trace_dir = "<REDACTED>/turns"
self_dispatch = true
obs_mode = "push"
max_skill_calls = 20
colocated = false
seed_workspace = true
n_examples = 8
seed = 0
explicit_seeds = [
    0,
]
harness_id = "nethack_v1"

[taskset.task]
judges = []

[taskset.env_args]
skill_set = "netplay"

[harness]
id = "claude_code"
forward_env = []
version = "2.1.214"

[harness.runtime]
type = "subprocess"

[harness.env]

[timeout]
setup = 1800.0
rollout = 3600.0

[retries.rollout]
max_retries = 0
include = []
exclude = []

[interception]
type = "elastic"
multiplex = 32

[args]

[extra_env_kwargs]

[pool]
type = "elastic"
multiplex = 128

[client]
base_url = "https://api.pinference.ai/api/v1"
api_key_var = "PRIME_API_KEY"
type = "eval"

[client.headers]
X-Prime-Team-ID = "<REDACTED: funded team id, auto-resolved from ~/.prime/config.json>"

[sampling]
