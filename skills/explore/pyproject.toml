# Kernel-side package for the explore skill (checkpointed exploration, the
# paper's Prime-Agent-Explore). It talks to the host only through
# rlm.host_request / rlm.spawn; prime-agent-runtime is installed in the kernel
# venv before skills, so it is not declared as a dependency.
[project]
name = "explore"
version = "0.1.0"
description = "Checkpointed exploration: a checkpoint ledger, a leaderboard, and the select() call that forks a player from a checkpoint"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/explore"]
